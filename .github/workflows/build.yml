name: Universal ZIP to APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Unzip any project zips
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -oq "$z" -d project_src; done

      - name: Find Android project root
        id: find
        run: |
          S=$(find . -name "settings.gradle*" | head -n1)
          if [ -z "$S" ]; then echo "No Android project found"; exit 1; fi
          echo "dir=$(dirname "$S")" >> $GITHUB_OUTPUT

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: '**/build/outputs/apk/**/*.apk'
